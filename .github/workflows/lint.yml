name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Skill Validation
    uses: netresearch/skill-repo-skill/.github/workflows/validate.yml@main
    with:
      # tests/convert.sh is clean at ShellCheck's strictest level, which is
      # also the level the pre-commit shellcheck hook runs at (no args).
      shellcheck-severity: style
